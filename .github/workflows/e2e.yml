name: E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'clinic-api/**'
      - 'payer-api/**'
      - 'care-platform/**'
      - 'infra/**'
      - '.github/workflows/e2e.yml'
      - '.github/scripts/e2e-suites.sh'
  pull_request:
    paths:
      - 'clinic-api/**'
      - 'payer-api/**'
      - 'care-platform/**'
      - 'infra/**'
      - '.github/workflows/e2e.yml'
      - '.github/scripts/e2e-suites.sh'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.suites.outputs.suites }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the e2e suites this change can break
        id: suites
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/e2e-suites.sh

  e2e:
    needs: changes
    if: needs.changes.outputs.suites != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: care-platform/package-lock.json

      - name: Start PostgreSQL and both HAPI FHIR servers
        run: |
          docker compose -f infra/docker-compose.yml up -d postgres hapi-fhir hapi-fhir-payer
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/fhir/metadata > /dev/null && exit 0
            sleep 5
          done
          docker compose -f infra/docker-compose.yml logs hapi-fhir
          exit 1

      - name: Start clinic-api
        working-directory: clinic-api
        run: |
          nohup ./mvnw -B spring-boot:run -Dspring.output.ansi.enabled=NEVER > "$RUNNER_TEMP/clinic-api.log" 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9090/api/auth/login || true)
            [ "$code" != "000" ] && exit 0
            sleep 3
          done
          cat "$RUNNER_TEMP/clinic-api.log"
          exit 1

      - name: Start payer-api
        working-directory: payer-api
        run: |
          nohup ./mvnw -B spring-boot:run -Dspring.output.ansi.enabled=NEVER > "$RUNNER_TEMP/payer-api.log" 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9095/actuator/health || true)
            [ "$code" != "000" ] && exit 0
            sleep 3
          done
          cat "$RUNNER_TEMP/payer-api.log"
          exit 1

      - name: Install frontend dependencies
        working-directory: care-platform
        run: |
          npm ci
          npx cypress install

      - name: Wait for the payer HAPI to load its IG packages
        run: |
          WAIT_SECONDS=600 bash infra/payer/smoke.sh && exit 0
          docker compose -f infra/docker-compose.yml logs hapi-fhir-payer
          exit 1

      - name: Run e2e suites
        working-directory: care-platform
        run: npx nx run-many -t e2e -p ${{ needs.changes.outputs.suites }} --parallel=1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-reports
          path: |
            care-platform/apps/*-e2e/reports/
            care-platform/dist/cypress/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: api-logs
          path: |
            ${{ runner.temp }}/clinic-api.log
            ${{ runner.temp }}/payer-api.log
