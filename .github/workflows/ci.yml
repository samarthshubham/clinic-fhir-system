name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      payer: ${{ steps.areas.outputs.payer }}
      frontend: ${{ steps.areas.outputs.frontend }}
      igvalidate: ${{ steps.areas.outputs.igvalidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect which apps changed
        id: areas
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/changed-areas.sh

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clinic-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check formatting
        run: ./mvnw -B spotless:check

      - name: Build, test and measure coverage
        run: ./mvnw -B verify

      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          root = ET.parse('target/site/jacoco/jacoco.xml').getroot()
          line = next(c for c in root.findall('counter') if c.get('type') == 'LINE')
          missed, covered = int(line.get('missed')), int(line.get('covered'))
          print(f"### Backend line coverage: {covered / (missed + covered):.1%} ({covered}/{missed + covered})")
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: clinic-api/target/site/jacoco/

      - uses: actions/upload-artifact@v4
        with:
          name: clinic-api-fhir-out
          path: clinic-api/target/fhir-out/
          if-no-files-found: ignore

  payer-api:
    needs: changes
    if: needs.changes.outputs.payer == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payer-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check formatting
        run: ./mvnw -B spotless:check

      - name: Build, test and measure coverage
        run: ./mvnw -B verify

      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          root = ET.parse('target/site/jacoco/jacoco.xml').getroot()
          line = next(c for c in root.findall('counter') if c.get('type') == 'LINE')
          missed, covered = int(line.get('missed')), int(line.get('covered'))
          print(f"### payer-api line coverage: {covered / (missed + covered):.1%} ({covered}/{missed + covered})")
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payer-api-coverage
          path: payer-api/target/site/jacoco/

      - uses: actions/upload-artifact@v4
        with:
          name: payer-api-fhir-out
          path: payer-api/target/fhir-out/
          if-no-files-found: ignore

  ig-validate:
    needs: [changes, backend, payer-api]
    if: needs.changes.outputs.igvalidate == 'true' && !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache the HL7 validator and FHIR packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/hl7-validator
            ~/.fhir/packages
          key: hl7-validator-${{ hashFiles('.github/scripts/ig-validate*', 'infra/docker-compose.yml') }}
          restore-keys: hl7-validator-

      - name: Download FHIR written by mapper tests
        uses: actions/download-artifact@v4
        with:
          pattern: '*-fhir-out'
          path: fhir-out

      - name: Validate golden fixtures and mapper output
        run: bash .github/scripts/ig-validate.sh fixtures/davinci fhir-out

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: care-platform
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: care-platform/package-lock.json

      - run: npm ci

      - name: Lint clinician-app, payer-app and the auth library
        run: npx nx run-many -t lint -p clinician-app payer-app payer-app-e2e auth

      - name: Lint changed files in other apps
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- 'care-platform/apps/**/*.ts' 'care-platform/apps/**/*.html' ':!care-platform/apps/clinician-app/**' ':!care-platform/apps/payer-app/**' ':!care-platform/apps/payer-app-e2e/**' | sed 's|^care-platform/||')
          if [ -z "$files" ]; then
            echo "No changed frontend files to lint."
            exit 0
          fi
          echo "$files"
          echo "$files" | xargs npx eslint --flag unstable_config_lookup_from_file

      - name: Test with coverage
        run: npx nx test clinician-app --coverage --watch=false

      - name: Test payer-app with coverage
        run: npx nx test payer-app --coverage --watch=false

      - name: Test seed-demo-data with coverage
        run: npx nx test seed-demo-data --coverage

      - name: Test the auth library with coverage
        run: npx nx test auth --coverage --watch=false

      - name: Test the e2e-support library with coverage
        run: npx nx test e2e-support --coverage

      - name: Build
        run: npx nx run-many -t build -p clinician-app payer-app

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: care-platform/coverage/clinician-app/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payer-app-coverage
          path: care-platform/coverage/payer-app/lcov.info

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seed-demo-data-coverage
          path: care-platform/coverage/seed-demo-data/lcov.info

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-coverage
          path: care-platform/coverage/auth/lcov.info

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-support-coverage
          path: care-platform/coverage/e2e-support/lcov.info

  coverage-gate:
    if: github.event_name == 'pull_request' && !cancelled()
    needs: [changes, backend, payer-api, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Upstream jobs must not have failed
        if: contains(needs.*.result, 'failure')
        run: |
          echo "::error::changes=${{ needs.changes.result }} backend=${{ needs.backend.result }} payer-api=${{ needs.payer-api.result }} frontend=${{ needs.frontend.result }}"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: pip install diff-cover

      - uses: actions/download-artifact@v4
        if: needs.backend.result == 'success'
        with:
          name: backend-coverage
          path: reports/backend

      - name: Backend changed lines must be at least 70% covered
        if: needs.backend.result == 'success'
        run: |
          status=0
          diff-cover reports/backend/jacoco.xml --src-roots clinic-api/src/main/java \
            --compare-branch="origin/${{ github.base_ref }}" --fail-under=70 \
            --format markdown:backend.md || status=1
          { echo "## Backend changed-line coverage"; cat backend.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - uses: actions/download-artifact@v4
        if: needs.payer-api.result == 'success'
        with:
          name: payer-api-coverage
          path: reports/payer-api

      - name: payer-api changed lines must be at least 70% covered
        if: needs.payer-api.result == 'success'
        run: |
          status=0
          diff-cover reports/payer-api/jacoco.xml --src-roots payer-api/src/main/java \
            --compare-branch="origin/${{ github.base_ref }}" --fail-under=70 \
            --format markdown:payer-api.md || status=1
          { echo "## payer-api changed-line coverage"; cat payer-api.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - uses: actions/download-artifact@v4
        if: needs.frontend.result == 'success'
        with:
          name: frontend-coverage
          path: reports/frontend

      - uses: actions/download-artifact@v4
        if: needs.frontend.result == 'success'
        with:
          name: payer-app-coverage
          path: reports/payer-app

      - uses: actions/download-artifact@v4
        if: needs.frontend.result == 'success'
        with:
          name: seed-demo-data-coverage
          path: reports/seed-demo-data

      - uses: actions/download-artifact@v4
        if: needs.frontend.result == 'success'
        with:
          name: auth-coverage
          path: reports/auth

      - uses: actions/download-artifact@v4
        if: needs.frontend.result == 'success'
        with:
          name: e2e-support-coverage
          path: reports/e2e-support

      - name: Frontend changed lines must be at least 70% covered
        if: needs.frontend.result == 'success'
        run: |
          sed 's|^SF:apps/|SF:care-platform/apps/|' reports/frontend/lcov.info > reports/frontend/lcov-repo.info
          sed 's|^SF:apps/|SF:care-platform/apps/|' reports/payer-app/lcov.info > reports/payer-app/lcov-repo.info
          sed 's|^SF:apps/|SF:care-platform/apps/|' reports/seed-demo-data/lcov.info > reports/seed-demo-data/lcov-repo.info
          sed 's|^SF:libs/|SF:care-platform/libs/|' reports/auth/lcov.info > reports/auth/lcov-repo.info
          sed 's|^SF:libs/|SF:care-platform/libs/|' reports/e2e-support/lcov.info > reports/e2e-support/lcov-repo.info
          status=0
          diff-cover reports/frontend/lcov-repo.info reports/payer-app/lcov-repo.info reports/seed-demo-data/lcov-repo.info reports/auth/lcov-repo.info reports/e2e-support/lcov-repo.info \
            --compare-branch="origin/${{ github.base_ref }}" --fail-under=70 \
            --format markdown:frontend.md || status=1
          { echo "## Frontend changed-line coverage"; cat frontend.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Note skipped areas
        if: needs.backend.result != 'success' || needs.payer-api.result != 'success' || needs.frontend.result != 'success'
        run: |
          [ "${{ needs.backend.result }}" = success ] || echo "Backend: skipped, no backend changes." >> "$GITHUB_STEP_SUMMARY"
          [ "${{ needs.payer-api.result }}" = success ] || echo "payer-api: skipped, no payer-api changes." >> "$GITHUB_STEP_SUMMARY"
          [ "${{ needs.frontend.result }}" = success ] || echo "Frontend: skipped, no frontend changes." >> "$GITHUB_STEP_SUMMARY"
