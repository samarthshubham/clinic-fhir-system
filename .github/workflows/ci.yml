name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      frontend: ${{ steps.areas.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect which apps changed
        id: areas
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/changed-areas.sh

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clinic-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check formatting
        run: ./mvnw -B spotless:check

      - name: Build, test and measure coverage
        run: ./mvnw -B verify

      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          root = ET.parse('target/site/jacoco/jacoco.xml').getroot()
          line = next(c for c in root.findall('counter') if c.get('type') == 'LINE')
          missed, covered = int(line.get('missed')), int(line.get('covered'))
          print(f"### Backend line coverage: {covered / (missed + covered):.1%} ({covered}/{missed + covered})")
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: clinic-api/target/site/jacoco/

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: care-platform
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: care-platform/package-lock.json

      - run: npm ci

      - name: Lint clinician-app
        run: npx nx lint clinician-app

      - name: Lint changed files in other apps
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- 'care-platform/apps/**/*.ts' 'care-platform/apps/**/*.html' ':!care-platform/apps/clinician-app/**' | sed 's|^care-platform/||')
          if [ -z "$files" ]; then
            echo "No changed frontend files to lint."
            exit 0
          fi
          echo "$files"
          echo "$files" | xargs npx eslint --flag unstable_config_lookup_from_file

      - name: Test with coverage
        run: npx nx test clinician-app --coverage --watch=false

      - name: Test seed-demo-data with coverage
        run: npx nx test seed-demo-data --coverage

      - name: Build
        run: npx nx build clinician-app

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: care-platform/coverage/clinician-app/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seed-demo-data-coverage
          path: care-platform/coverage/seed-demo-data/lcov.info

  coverage-gate:
    if: github.event_name == 'pull_request' && !cancelled()
    needs: [changes, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Upstream jobs must not have failed
        if: contains(needs.*.result, 'failure')
        run: |
          echo "::error::changes=${{ needs.changes.result }} backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }}"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: pip install diff-cover

      - uses: actions/download-artifact@v4
        if: needs.backend.result == 'success'
        with:
          name: backend-coverage
          path: reports/backend

      - name: Backend changed lines must be at least 70% covered
        if: needs.backend.result == 'success'
        run: |
          status=0
          diff-cover reports/backend/jacoco.xml --src-roots clinic-api/src/main/java \
            --compare-branch="origin/${{ github.base_ref }}" --fail-under=70 \
            --format markdown:backend.md || status=1
          { echo "## Backend changed-line coverage"; cat backend.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - uses: actions/download-artifact@v4
        if: needs.frontend.result == 'success'
        with:
          name: frontend-coverage
          path: reports/frontend

      - uses: actions/download-artifact@v4
        if: needs.frontend.result == 'success'
        with:
          name: seed-demo-data-coverage
          path: reports/seed-demo-data

      - name: Frontend changed lines must be at least 70% covered
        if: needs.frontend.result == 'success'
        run: |
          sed 's|^SF:apps/|SF:care-platform/apps/|' reports/frontend/lcov.info > reports/frontend/lcov-repo.info
          sed 's|^SF:apps/|SF:care-platform/apps/|' reports/seed-demo-data/lcov.info > reports/seed-demo-data/lcov-repo.info
          status=0
          diff-cover reports/frontend/lcov-repo.info reports/seed-demo-data/lcov-repo.info \
            --compare-branch="origin/${{ github.base_ref }}" --fail-under=70 \
            --format markdown:frontend.md || status=1
          { echo "## Frontend changed-line coverage"; cat frontend.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Note skipped areas
        if: needs.backend.result != 'success' || needs.frontend.result != 'success'
        run: |
          [ "${{ needs.backend.result }}" = success ] || echo "Backend: skipped, no backend changes." >> "$GITHUB_STEP_SUMMARY"
          [ "${{ needs.frontend.result }}" = success ] || echo "Frontend: skipped, no frontend changes." >> "$GITHUB_STEP_SUMMARY"
