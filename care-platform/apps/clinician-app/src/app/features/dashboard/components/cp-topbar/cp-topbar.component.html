<header class="cp-topbar">
  <div class="cp-topbar__left">
    <div class="cp-topbar__brand">
      <div class="cp-topbar__brand-mark">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
        </svg>
      </div>
      <span class="cp-topbar__brand-name">Praxis</span>
      <span class="cp-topbar__brand-sub">/ Clinician</span>
    </div>
    <nav class="cp-topbar__nav" aria-label="Main navigation">
      <a
        class="cp-topbar__nav-item"
        routerLink="/patients"
        routerLinkActive="cp-topbar__nav-item--active"
        [routerLinkActiveOptions]="{ exact: true }"
        >Patients</a
      >
      <a
        class="cp-topbar__nav-item"
        role="button"
        tabindex="0"
        (click)="placeholder('Schedule')"
        (keydown.enter)="placeholder('Schedule')"
        (keydown.space)="placeholder('Schedule'); $event.preventDefault()"
        >Schedule</a
      >
      @if (canSeeClinical()) {
        <a
          class="cp-topbar__nav-item"
          role="button"
          tabindex="0"
          (click)="placeholder('Orders')"
          (keydown.enter)="placeholder('Orders')"
          (keydown.space)="placeholder('Orders'); $event.preventDefault()"
          >Orders</a
        >
        <a
          class="cp-topbar__nav-item"
          role="button"
          tabindex="0"
          (click)="placeholder('Inbox')"
          (keydown.enter)="placeholder('Inbox')"
          (keydown.space)="placeholder('Inbox'); $event.preventDefault()"
        >
          Inbox
          <span class="cp-topbar__nav-badge">3</span>
        </a>
      }
    </nav>
  </div>

  <div class="cp-topbar__right">
    <button
      class="cp-topbar__iconbtn"
      (click)="theme.toggle()"
      [attr.title]="
        theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'
      "
      [attr.aria-label]="
        theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'
      "
    >
      <mat-icon>{{ theme.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
    <button class="cp-topbar__iconbtn" aria-label="Notifications">
      <mat-icon>notifications</mat-icon>
      <span class="cp-topbar__dot" aria-hidden="true"></span>
    </button>
    @if (auth.user(); as user) {
      <div class="cp-topbar__user">
        <div class="cp-topbar__user-avatar" aria-hidden="true">
          {{ initials() }}
        </div>
        <div class="cp-topbar__user-meta">
          <span class="cp-topbar__user-name">{{ user.name }}</span>
          <span class="cp-topbar__user-role"
            >{{ roleLabel() }}{{ user.title ? ' · ' + user.title : '' }}</span
          >
        </div>
      </div>
      <button
        class="cp-topbar__iconbtn"
        (click)="auth.logout()"
        title="Sign out"
        aria-label="Sign out"
      >
        <mat-icon>logout</mat-icon>
      </button>
    }
  </div>
</header>
