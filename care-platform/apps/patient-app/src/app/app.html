<a href="#main-content" class="cp-skip-link">Skip to main content</a>

<div class="pa-root">
  @if (showNav()) {
  <aside class="pa-sidebar" aria-label="Main navigation">
    <div class="pa-side-brand">
      <div class="pa-brand-mark">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <path
            d="M3 12h4l2-4 3 8 2-4h7"
            stroke="white"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <span>Vitalist</span>
      <span class="sub">· patient</span>
    </div>

    <nav class="pa-side-nav" role="navigation">
      <div class="pa-nav-eyebrow">Menu</div>

      <button
        class="pa-nav-item"
        [class.active]="activeTab() === 'home'"
        [attr.aria-current]="activeTab() === 'home' ? 'page' : null"
        (click)="navigate('home')"
      >
        <span class="ico">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path
              d="M3 11l9-7 9 7v9a2 2 0 0 1-2 2h-4v-7h-6v7H5a2 2 0 0 1-2-2v-9z"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        Home
      </button>

      <button
        class="pa-nav-item"
        [class.active]="activeTab() === 'vitals'"
        [attr.aria-current]="activeTab() === 'vitals' ? 'page' : null"
        (click)="navigate('vitals')"
      >
        <span class="ico">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path
              d="M12 21s-7-4.35-9.5-9.04C.7 8.1 3 4 7 4c2.1 0 3.6 1.1 5 3 1.4-1.9 2.9-3 5-3 4 0 6.3 4.1 4.5 7.96C19 16.65 12 21 12 21z"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        Vitals
      </button>

      <button
        class="pa-nav-item"
        [class.active]="activeTab() === 'messages'"
        [attr.aria-current]="activeTab() === 'messages' ? 'page' : null"
        (click)="navigate('messages')"
      >
        <span class="ico">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path
              d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12z"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        Messages
      </button>

      <button
        class="pa-nav-item"
        [class.active]="activeTab() === 'profile'"
        [attr.aria-current]="activeTab() === 'profile' ? 'page' : null"
        (click)="navigate('profile')"
      >
        <span class="ico">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <circle
              cx="12"
              cy="8"
              r="4"
              stroke="currentColor"
              stroke-width="1.8"
            />
            <path
              d="M4 21c1-4 4.5-6 8-6s7 2 8 6"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
        </span>
        Profile
      </button>
    </nav>

    <button class="pa-side-patient" (click)="signOut()" aria-label="Sign out">
      <div class="pa-side-avatar">{{ patientInitials() }}</div>
      <div class="pa-side-patient-info">
        <div class="pa-side-patient-nm">{{ patientName() }}</div>
        <div class="pa-side-patient-mt">Sign out</div>
      </div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
        <path
          d="M9 6l6 6-6 6"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
  </aside>
  }

  <main id="main-content" class="pa-content">
    <router-outlet />
  </main>

  @if (showNav()) {
  <nav class="pa-bottom-nav" role="tablist">
    <button
      class="pa-tab"
      [class.active]="activeTab() === 'home'"
      role="tab"
      [attr.aria-selected]="activeTab() === 'home'"
      (click)="navigate('home')"
    >
      <span class="pa-tab-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path
            d="M3 11l9-7 9 7v9a2 2 0 0 1-2 2h-4v-7h-6v7H5a2 2 0 0 1-2-2v-9z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />
        </svg>
      </span>
      Home
    </button>

    <button
      class="pa-tab"
      [class.active]="activeTab() === 'vitals'"
      role="tab"
      [attr.aria-selected]="activeTab() === 'vitals'"
      (click)="navigate('vitals')"
    >
      <span class="pa-tab-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path
            d="M12 21s-7-4.35-9.5-9.04C.7 8.1 3 4 7 4c2.1 0 3.6 1.1 5 3 1.4-1.9 2.9-3 5-3 4 0 6.3 4.1 4.5 7.96C19 16.65 12 21 12 21z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />
        </svg>
      </span>
      Vitals
    </button>

    <button
      class="pa-tab"
      [class.active]="activeTab() === 'messages'"
      role="tab"
      [attr.aria-selected]="activeTab() === 'messages'"
      (click)="navigate('messages')"
    >
      <span class="pa-tab-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path
            d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />
        </svg>
      </span>
      Messages
    </button>

    <button
      class="pa-tab"
      [class.active]="activeTab() === 'profile'"
      role="tab"
      [attr.aria-selected]="activeTab() === 'profile'"
      (click)="navigate('profile')"
    >
      <span class="pa-tab-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <circle
            cx="12"
            cy="8"
            r="4"
            stroke="currentColor"
            stroke-width="1.8"
          />
          <path
            d="M4 21c1-4 4.5-6 8-6s7 2 8 6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </span>
      Profile
    </button>
  </nav>
  }
</div>
