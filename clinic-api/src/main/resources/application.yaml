spring:
  application:
    name: clinic-api

server:
  port: 9090

fhir:
  server:
    url: http://localhost:8080/fhir

clinical:
  thresholds:
    systolic-warn: 140
    systolic-critical: 180
    diastolic-warn: 90
    diastolic-critical: 120
    spo2-warn: 95.0
    spo2-critical: 90.0

clinic:
  default-org-id: seed-default-org
  alerts:
    webhook-url: http://host.docker.internal:9090/api/alerts/bp-subscription
    webhook-secret: ${CLINIC_ALERTS_WEBHOOK_SECRET:dev-only-alert-secret}
    first-lookback: 24h

logging:
  level:
    io.github.samarthshubham.clinic: DEBUG
    ca.uhn.fhir: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
