spring:
  application:
    name: clinic-api

server:
  port: 9090

fhir:
  server:
    url: http://localhost:8080/fhir

clinical:
  thresholds:
    systolic-warn: 140
    systolic-critical: 180
    diastolic-warn: 90
    diastolic-critical: 120
    spo2-warn: 95.0
    spo2-critical: 90.0

clinic:
  default-org-id: seed-default-org
  alerts:
    webhook-url: http://host.docker.internal:9090/api/alerts/bp-subscription
    webhook-secret: ${CLINIC_ALERTS_WEBHOOK_SECRET:dev-only-alert-secret}
    first-lookback: 24h
  auth:
    jwt-secret: ${CLINIC_JWT_SECRET:}
    issuer: clinic-api
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  payer:
    base-url: ${CLINIC_PAYER_API_URL:http://localhost:9095}
    client-id: clinic-api
    client-secret: ${CLINIC_PAYER_CLIENT_SECRET:}
    scope: system/Claim.c system/Claim.r system/Coverage.r system/Questionnaire.r
    decision-webhook-secret: ${PAS_DECISION_WEBHOOK_SECRET:}
    decision-poll-interval: ${PAS_DECISION_POLL_INTERVAL:1m}
    timeout: 2s
    pas-submit-timeout: ${PAS_SUBMIT_TIMEOUT:60s}
    payer-id: praxis-health-plan

logging:
  level:
    io.github.samarthshubham.clinic: DEBUG
    ca.uhn.fhir: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
