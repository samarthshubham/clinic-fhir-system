        clinicalStatus:
          type: string
          nullable: true
          example: "active"
        onsetDate:
          type: string
          format: date
          nullable: true
          example: "2024-01-15"

    MedicationResponse:
      type: object
      properties:
        id:
          type: string
          example: "med1"
        patientId:
          type: string
          nullable: true
          example: "abc123"
        medicationName:
          type: string
          nullable: true
          example: "Lisinopril 10mg"
        status:
          type: string
          nullable: true
          example: "active"
        dosageText:
          type: string
          nullable: true
          example: "Once daily"
        startDate:
          type: string
          format: date
          nullable: true
          example: "2024-01-20"

    AppointmentResponse:
      type: object
      properties:
        id:
          type: string
          example: "appt1"
        patientId:
          type: string
          nullable: true
          example: "abc123"
        practitionerId:
          type: string
          nullable: true
          example: "pract1"
        start:
          type: string
          format: date-time
          nullable: true
          example: "2026-06-01T09:00:00-04:00"
        end:
          type: string
          format: date-time
          nullable: true
          example: "2026-06-01T09:30:00-04:00"
        description:
          type: string
          nullable: true
          example: "3-month hypertension review"
        status:
          type: string
          nullable: true
          example: "booked"

    ServiceRequestResponse:
      type: object
      properties:
        id:
          type: string
          example: "sr1"
        patientId:
          type: string
          nullable: true
          example: "abc123"
        encounterId:
          type: string
          nullable: true
          example: "enc1"
        practitionerId:
          type: string
          nullable: true
          example: "pract1"
        code:
          type: string
          nullable: true
          example: "Lipid Panel"
        category:
          type: string
          nullable: true
          example: "laboratory"
        status:
          type: string
          nullable: true
          example: "active"
        priority:
          type: string
          nullable: true
          example: "routine"
        authoredOn:
          type: string
          format: date
          nullable: true
          example: "2026-04-14"

    DiagnosticReportResponse:
      type: object
      properties:
        id:
          type: string
          example: "rpt1"
        patientId:
          type: string
          nullable: true
          example: "abc123"
        encounterId:
          type: string
          nullable: true
          example: "enc1"
        serviceRequestId:
          type: string
          nullable: true
          example: "sr1"
        title:
          type: string
          nullable: true
          example: "Lipid Panel"
        status:
          type: string
