      required: [patientId, start, end, status]
      properties:
        patientId:
          type: string
          example: "abc123"
        practitionerId:
          type: string
          example: "prac456"
        start:
          type: string
          format: date-time
          example: "2026-06-10T09:00:00"
        end:
          type: string
          format: date-time
          example: "2026-06-10T09:30:00"
        description:
          type: string
          example: "Follow-up — diabetes management"
        status:
          type: string
          enum: [proposed, pending, booked, arrived, fulfilled, cancelled, noshow, entered-in-error, checked-in, waitlist]
          example: "booked"

    ServiceRequestRequest:
      type: object
      required: [patientId, code, category, status, priority, authoredOn]
      properties:
        patientId:
          type: string
          example: "abc123"
        encounterId:
          type: string
          example: "enc789"
        practitionerId:
          type: string
          example: "prac456"
        code:
          type: string
          example: "HbA1c"
        category:
          type: string
          example: "Laboratory"
        status:
          type: string
          enum: [draft, active, on-hold, revoked, completed, entered-in-error, unknown]
          example: "active"
        priority:
          type: string
          enum: [routine, urgent, asap, stat]
          example: "routine"
        authoredOn:
          type: string
          format: date
          example: "2026-05-15"

    DiagnosticReportRequest:
      type: object
      required: [patientId, title, status, issued]
      properties:
        patientId:
          type: string
          example: "abc123"
        encounterId:
          type: string
          example: "enc789"
