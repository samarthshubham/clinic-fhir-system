openapi: 3.0.3
info:
  title: Clinic FHIR API
  description: |
    REST API for the clinic-fhir-system Spring Boot backend.

    Every endpoint returns `application/json`. FHIR R4 is the storage format behind the API, not the contract.
    **CRUD endpoints** return flat response DTOs; list endpoints wrap them in `{ items, total }`, where `items` is the first page of HAPI results and `total` is HAPI's total (no paging yet).
    **Experience API endpoints** (`/snapshot`, `/trends`, `/timeline`, `/dashboard`) return aggregated DTOs.

    **Authentication.** Every endpoint except `/api/auth/*`, the alert webhook and the public actuator endpoints needs
    `Authorization: Bearer <accessToken>`. Get a token from `POST /api/auth/login`, then click **Authorize** and paste
    the `accessToken`. Access tokens last 15 minutes; exchange the refresh token at `POST /api/auth/refresh` for a new pair.
    No token, or an invalid/expired one, returns `401`. A valid token without the required permission returns `403`.

    **Roles → permissions.** Tokens carry roles; the server expands them into permissions on each request.
    `FRONT_DESK`: patient and appointment read/write, practitioner read.
    `CLINICIAN`: everything except `practitioner:write`.
    `ADMIN`: everything.
  version: 1.0.0
  contact:
    name: samarthshubham
    url: https://github.com/samarthshubham/clinic-fhir-system

servers:
  - url: http://localhost:9090
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Login and token refresh
  - name: Patients
    description: Patient registration and search
  - name: Encounters
    description: Clinical visits
  - name: Vitals
    description: Vital sign observations
  - name: Practitioners
    description: Clinician registry
  - name: Conditions
    description: Diagnoses
  - name: Medications
    description: Medication statements
  - name: Appointments
    description: Scheduled appointments
  - name: Service Requests
    description: Lab and imaging orders
  - name: Diagnostic Reports
    description: Lab and imaging results
  - name: Care Plans
    description: Patient care plans
  - name: Goals
    description: Clinical goals
  - name: Experience APIs
    description: Aggregated clinical data (flat JSON, not FHIR)
  - name: Alerts
    description: Clinician alerts driven by FHIR Subscriptions

paths:

  # ── Auth ──────────────────────────────────────────────────────────────────

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive an access + refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: "clinician"
              password: "Clinician#2026"
      responses:
        '200':
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 401
                message: "Invalid username or password"

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Refresh token invalid, expired, or used as an access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 401
                message: "Invalid or expired refresh token"

  # ── Patients ──────────────────────────────────────────────────────────────

  /api/patients:
    post:
      tags: [Patients]
      summary: Register a new patient
      description: Requires the `patient:write` permission (all roles).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientRequest'
            example:
              firstName: "Marcus"
              lastName: "Webb"
              dateOfBirth: "1978-04-15"
              gender: "male"
              phone: "555-0101"
              email: "marcus.webb@example.com"
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Patient created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

    get:
      tags: [Patients]
      summary: Search patients
      description: Requires the `patient:read` permission (all roles).
      parameters:
        - name: name
          in: query
          schema:
            type: string
          description: Partial name match
          example: "Webb"
        - name: dob
          in: query
          schema:
            type: string
            format: date
          description: Date of birth (ISO 8601)
          example: "1978-04-15"
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Page of Patient responses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientPage'

  /api/patients/{id}:
    get:
      tags: [Patients]
      summary: Get patient by ID
      description: Requires the `patient:read` permission (all roles).
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Patient found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/patients/{id}/snapshot:
    get:
      tags: [Experience APIs]
      summary: At-a-glance snapshot — active conditions, meds, latest vitals, alerts
      description: Requires the `clinical:read` permission (ADMIN, CLINICIAN).
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Snapshot data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/patients/{id}/trends:
    get:
      tags: [Experience APIs]
      summary: Chart-ready vitals time series
      description: Requires the `clinical:read` permission (ADMIN, CLINICIAN).
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: type
          in: query
          schema:
            type: string
          description: "Comma-separated vital types: bp, spo2, weight, heartRate, temperature"
          example: "bp,spo2"
        - name: period
          in: query
          schema:
            type: string
          description: "Lookback period, e.g. 30d, 90d, 1y"
          example: "30d"
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Trends series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendsResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/patients/{id}/timeline:
    get:
      tags: [Experience APIs]
      summary: Unified chronological event feed with cursor pagination
      description: Requires the `clinical:read` permission (ADMIN, CLINICIAN).
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
          description: Max events to return
        - name: before
          in: query
          schema:
            type: string
            format: date
          description: Cursor — return events before this date
          example: "2026-05-01"
        - name: types
          in: query
          schema:
            type: string
          description: "Comma-separated event types: encounter, report, vital, condition"
          example: "encounter,report"
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: List of timeline events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimelineEvent'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Encounters ────────────────────────────────────────────────────────────

  /api/encounters:
    post:
      tags: [Encounters]
      summary: Record a clinical visit
      description: Requires the `encounter:write` permission (ADMIN, CLINICIAN).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EncounterRequest'
            example:
              patientId: "abc123"
              visitDate: "2026-05-15"
              reason: "Annual physical"
              status: "finished"
              practitionerId: "prac456"
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Encounter created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncounterResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

    get:
      tags: [Encounters]
      summary: List encounters for a patient
      description: Requires the `clinical:read` permission (ADMIN, CLINICIAN).
      parameters:
        - name: patientId
          in: query
          required: true
          schema:
            type: string
          example: "abc123"
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Page of Encounter responses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncounterPage'

  /api/encounters/{id}:
    get:
      tags: [Encounters]
      summary: Get encounter by ID
      description: Requires the `clinical:read` permission (ADMIN, CLINICIAN).
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Encounter found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncounterResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Vitals ────────────────────────────────────────────────────────────────

  /api/vitals:
    post:
      tags: [Vitals]
      summary: Record vital signs (auto-evaluates conditions on creation)
      description: Requires the `vitals:write` permission (ADMIN, CLINICIAN).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VitalsRequest'
            example:
              patientId: "abc123"
              effectiveDate: "2026-05-15"
              systolicBp: 135
              diastolicBp: 85
              weightKg: 82.5
              spo2Percent: 97.0
              heartRateBpm: 72
              temperatureCelsius: 36.8
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Created observations, one per recorded vital
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObservationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

    get:
      tags: [Vitals]
      summary: Get vitals for a patient
      description: Requires the `clinical:read` permission (ADMIN, CLINICIAN).
      parameters:
        - name: patientId
          in: query
          required: true
          schema:
            type: string
          example: "abc123"
        - name: type
          in: query
          schema:
            type: string
            enum: [systolic, diastolic, weight, spo2, heartRate, temperature]
          description: Filter by vital type
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Page of Observation responses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationPage'

  # ── Practitioners ─────────────────────────────────────────────────────────

  /api/practitioners:
    post:
      tags: [Practitioners]
      summary: Register a practitioner
      description: Requires the `practitioner:write` permission (ADMIN).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PractitionerRequest'
            example:
              firstName: "Sarah"
              lastName: "Chen"
              specialty: "Internal Medicine"
              npi: "1234567890"
              email: "s.chen@clinic.example"
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Practitioner created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PractitionerResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/practitioners/{id}:
    get:
      tags: [Practitioners]
      summary: Get practitioner by ID
      description: Requires the `practitioner:read` permission (all roles).
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Practitioner found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PractitionerResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Conditions ────────────────────────────────────────────────────────────

  /api/conditions:
    post:
      tags: [Conditions]
      summary: Record a diagnosis
      description: Requires the `condition:write` permission (ADMIN, CLINICIAN).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConditionRequest'
            example:
              patientId: "abc123"
              code: "44054006"
              display: "Type 2 Diabetes Mellitus"
              clinicalStatus: "active"
              onsetDate: "2020-01-10"
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Condition created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConditionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

    get:
      tags: [Conditions]
      summary: List conditions for a patient
      description: Requires the `clinical:read` permission (ADMIN, CLINICIAN).
      parameters:
        - name: patientId
          in: query
          required: true
          schema:
            type: string
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Page of Condition responses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConditionPage'

  /api/conditions/{id}:
    get:
      tags: [Conditions]
      summary: Get condition by ID
      description: Requires the `clinical:read` permission (ADMIN, CLINICIAN).
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Condition found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConditionResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Medications ───────────────────────────────────────────────────────────

  /api/medications:
    post:
      tags: [Medications]
      summary: Record a medication statement
      description: Requires the `medication:write` permission (ADMIN, CLINICIAN).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicationRequest'
            example:
              patientId: "abc123"
              medicationName: "Metformin 500mg"
              status: "active"
              dosageText: "1 tablet twice daily with meals"
              startDate: "2020-02-01"
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Medication created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

    get:
      tags: [Medications]
      summary: List medications for a patient
      description: Requires the `clinical:read` permission (ADMIN, CLINICIAN).
      parameters:
        - name: patientId
          in: query
          required: true
          schema:
            type: string
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Page of Medication responses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicationPage'

  # ── Appointments ──────────────────────────────────────────────────────────

  /api/appointments:
    post:
      tags: [Appointments]
      summary: Schedule an appointment
      description: Requires the `appointment:write` permission (all roles).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
            example:
              patientId: "abc123"
              practitionerId: "prac456"
              start: "2026-06-10T09:00:00"
              end: "2026-06-10T09:30:00"
              description: "Follow-up — diabetes management"
              status: "booked"
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Appointment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

    get:
      tags: [Appointments]
      summary: List appointments for a patient
      description: Requires the `appointment:read` permission (all roles).
      parameters:
        - name: patientId
          in: query
          required: true
          schema:
            type: string
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Page of Appointment responses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentPage'

  # ── Service Requests ──────────────────────────────────────────────────────

  /api/service-requests:
    post:
      tags: [Service Requests]
      summary: Place a lab or imaging order
      description: Requires the `order:write` permission (ADMIN, CLINICIAN).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequestRequest'
            example:
              patientId: "abc123"
              code: "HbA1c"
              category: "Laboratory"
              status: "active"
              priority: "routine"
              authoredOn: "2026-05-15"
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequestResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

    get:
      tags: [Service Requests]
      summary: List orders for a patient
      description: Requires the `clinical:read` permission (ADMIN, CLINICIAN).
      parameters:
        - name: patientId
          in: query
          required: true
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, completed, revoked]
          description: Optional status filter
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Page of ServiceRequest responses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequestPage'

  /api/service-requests/{id}:
    get:
      tags: [Service Requests]
      summary: Get order by ID
      description: Requires the `clinical:read` permission (ADMIN, CLINICIAN).
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequestResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Diagnostic Reports ────────────────────────────────────────────────────

  /api/diagnostic-reports:
    post:
      tags: [Diagnostic Reports]
      summary: Create a report (auto-marks linked ServiceRequest as completed)
      description: Requires the `order:write` permission (ADMIN, CLINICIAN).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosticReportRequest'
            example:
              patientId: "abc123"
              serviceRequestId: "sr789"
              title: "HbA1c Result"
              status: "final"
              issued: "2026-05-16"
              conclusion: "HbA1c 7.2% — well-controlled"
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Report created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticReportResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

    get:
      tags: [Diagnostic Reports]
      summary: List reports for a patient
      description: Requires the `clinical:read` permission (ADMIN, CLINICIAN).
      parameters:
        - name: patientId
          in: query
          required: true
          schema:
            type: string
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Page of DiagnosticReport responses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticReportPage'

  # ── Care Plans ────────────────────────────────────────────────────────────

  /api/care-plans:
    post:
      tags: [Care Plans]
      summary: Create a care plan
      description: Requires the `careplan:write` permission (ADMIN, CLINICIAN).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarePlanRequest'
            example:
              patientId: "abc123"
              conditionIds: ["cond001"]
              title: "Diabetes Management Plan"
              status: "active"
              periodStart: "2026-01-01"
              goalIds: ["goal001"]
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Care plan created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarePlanResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

    get:
      tags: [Care Plans]
      summary: List care plans for a patient
      description: Requires the `clinical:read` permission (ADMIN, CLINICIAN).
      parameters:
        - name: patientId
          in: query
          required: true
          schema:
            type: string
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Page of CarePlan responses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarePlanPage'

  # ── Goals ─────────────────────────────────────────────────────────────────

  /api/goals:
    post:
      tags: [Goals]
      summary: Create a clinical goal
      description: Requires the `careplan:write` permission (ADMIN, CLINICIAN).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalRequest'
            example:
              patientId: "abc123"
              description: "Reduce HbA1c below 7.0%"
              status: "active"
              targetMeasureCode: "4548-4"
              targetMeasureDisplay: "HbA1c"
              targetValue: 7.0
              targetUnit: "%"
              targetDate: "2026-12-31"
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Goal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

    get:
      tags: [Goals]
      summary: List goals for a patient
      description: Requires the `clinical:read` permission (ADMIN, CLINICIAN).
      parameters:
        - name: patientId
          in: query
          required: true
          schema:
            type: string
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Page of Goal responses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalPage'

  # ── Dashboard ─────────────────────────────────────────────────────────────

  /api/dashboard/{patientId}:
    get:
      tags: [Experience APIs]
      summary: Full clinical dashboard — partial-failure safe
      description: |
        Requires the `clinical:read` permission (ADMIN, CLINICIAN).

        Aggregates all clinical data for a patient into a single response.
        If a section fails to load, it is omitted and a warning is added to `_warnings[]`.
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
          example: "abc123"
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Dashboard data (may include warnings for degraded sections)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Alerts ────────────────────────────────────────────────────────────────

  /api/alerts/bp-subscription:
    post:
      tags: [Alerts]
      summary: FHIR Subscription webhook for critical systolic BP
      security: []
      description: |
        Called by HAPI FHIR (rest-hook, empty payload) when a systolic BP Observation above
        `clinical.thresholds.systolic-critical` is stored. The request carries no body; clinic-api
        looks up the new readings and notifies clinicians with Patient/Observation references only.
      parameters:
        - name: X-Alert-Secret
          in: header
          required: true
          description: Shared secret from `clinic.alerts.webhook-secret`, sent by the Subscription channel header
          schema:
            type: string
      responses:
        '204':
          description: Notification processed
        '401':
          description: Missing or invalid webhook secret

# ── Components ──────────────────────────────────────────────────────────────

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `POST /api/auth/login` (HS256, 15 minutes)

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: HAPI FHIR resource ID
      example: "abc123"

  responses:
    Unauthorized:
      description: Missing, invalid or expired access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 401
            message: "Authentication required"

    Forbidden:
      description: Authenticated, but the role lacks the required permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 403
            message: "Access denied"

    ValidationError:
      description: Request body failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 400
            message: "firstName must not be blank"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            message: "Patient abc123 not found"

  schemas:

    # ── Error ──────────────────────────────────────────────────────────────

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          example: 404
        message:
          type: string
          example: "Patient abc123 not found"

    # ── Auth ───────────────────────────────────────────────────────────────

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: "clinician"
        password:
          type: string
          format: password

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    AuthUser:
      type: object
      properties:
        username:
          type: string
          example: "clinician"
        name:
          type: string
          example: "Anika Patel"
        title:
          type: string
          nullable: true
          example: "Internal Medicine"
        practitionerId:
          type: string
          nullable: true
          description: FHIR Practitioner linked by the username identifier
          example: "user-clinician"
        roles:
          type: array
          items:
            type: string
            enum: [ADMIN, CLINICIAN, FRONT_DESK]

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: "JWT sent as `Authorization: Bearer …`"
        refreshToken:
          type: string
          description: JWT accepted only by `/api/auth/refresh`
        tokenType:
          type: string
          example: "Bearer"
        expiresIn:
          type: integer
          description: Access token lifetime in seconds
          example: 900
        user:
          $ref: '#/components/schemas/AuthUser'

    # ── Response DTOs ──────────────────────────────────────────────────────
    # Fields missing from the stored FHIR resource are null.

    PatientResponse:
      type: object
      properties:
        id:
          type: string
          example: "abc123"
        firstName:
          type: string
          nullable: true
          example: "Marcus"
        lastName:
          type: string
          nullable: true
          example: "Webb"
        dateOfBirth:
          type: string
          format: date
          nullable: true
          example: "1978-04-15"
        gender:
          type: string
          nullable: true
          example: "male"
        phone:
          type: string
          nullable: true
          example: "555-0101"
        email:
          type: string
          nullable: true
          example: "marcus.webb@example.com"
        active:
          type: boolean
          nullable: true
          example: true

    EncounterResponse:
      type: object
      properties:
        id:
          type: string
          example: "enc1"
        patientId:
          type: string
          nullable: true
          example: "abc123"
        visitDate:
          type: string
          format: date
          nullable: true
          example: "2026-05-15"
        reason:
          type: string
          nullable: true
          example: "Hypertension follow-up"
        status:
          type: string
          nullable: true
          example: "finished"
        practitionerId:
          type: string
          nullable: true
          example: "pract1"
        note:
          type: string
          nullable: true
          example: "Advised low-salt diet"

    ObservationResponse:
      type: object
      properties:
        id:
          type: string
          example: "obs1"
        patientId:
          type: string
          nullable: true
          example: "abc123"
        encounterId:
          type: string
          nullable: true
          example: "enc1"
        type:
          type: string
          nullable: true
          enum: [systolic, diastolic, weight, spo2, heartRate, temperature, null]
          description: null for LOINC codes outside the vitals table
          example: "systolic"
        loincCode:
          type: string
          nullable: true
          example: "8480-6"
        value:
          type: number
          nullable: true
          example: 135.0
        unit:
          type: string
          nullable: true
          example: "mm[Hg]"
        effectiveDateTime:
          type: string
          nullable: true
          description: >-
            ISO-8601 string exactly as stored, taken from effectiveDateTime, effectivePeriod.start
            or effectiveInstant (in that order). Precision varies with the source: a date
            (2026-05-15), a date-time with offset, or an instant with milliseconds.
            null when the observation has no such value.
          example: "2026-05-15T00:00:00-04:00"

    PractitionerResponse:
      type: object
      properties:
        id:
          type: string
          example: "pract1"
        firstName:
          type: string
          nullable: true
          example: "Aisha"
        lastName:
          type: string
          nullable: true
          example: "Patel"
        specialty:
          type: string
          nullable: true
          example: "Internal Medicine"
        npi:
          type: string
          nullable: true
          example: "1234567890"
        email:
          type: string
          nullable: true
          example: "a.patel@clinic.com"

    ConditionResponse:
      type: object
