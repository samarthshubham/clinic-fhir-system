    LatestVitals:
      type: object
      properties:
        systolicBp:
          $ref: '#/components/schemas/VitalReading'
        diastolicBp:
          $ref: '#/components/schemas/VitalReading'
        weightKg:
          $ref: '#/components/schemas/VitalReading'
        spo2Percent:
          $ref: '#/components/schemas/VitalReading'
        heartRate:
          $ref: '#/components/schemas/VitalReading'
        temperature:
          $ref: '#/components/schemas/VitalReading'

    AlertItem:
      type: object
      properties:
        severity:
          type: string
          enum: [warning, critical]
          example: "warning"
        type:
          type: string
          example: "ELEVATED_BLOOD_PRESSURE"
        message:
          type: string
          example: "Systolic BP 135 mm[Hg] — above warning threshold (140)"
        resourceId:
          type: string
          example: "obs456"

    SnapshotResponse:
      type: object
      properties:
        activeConditions:
          type: array
          items:
            type: object
          description: Active FHIR Condition summaries
        currentMedications:
          type: array
          items:
            type: object
          description: Active MedicationStatement summaries
        latestVitals:
          $ref: '#/components/schemas/LatestVitals'
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/AlertItem'

    DataPoint:
      type: object
      properties:
        date:
          type: string
          format: date
          example: "2026-05-15"
        value:
          type: number
          format: double
          example: 135.0

    BpSeries:
      type: object
      properties:
        systolic:
          type: array
          items:
            $ref: '#/components/schemas/DataPoint'
        diastolic:
          type: array
          items:
            $ref: '#/components/schemas/DataPoint'
        referenceRange:
          type: object
          additionalProperties:
            type: integer
          example:
            warnSystolic: 140
            critSystolic: 180
            warnDiastolic: 90
            critDiastolic: 120

    SimpleSeries:
      type: object
      properties:
        values:
          type: array
          items:
            $ref: '#/components/schemas/DataPoint'
        unit:
          type: string
          example: "%"
        referenceRange:
          type: object
          additionalProperties: true

    TrendsResponse:
      type: object
      properties:
        period:
          type: string
          example: "30d"
        from:
          type: string
          format: date
          example: "2026-04-23"
        to:
          type: string
          format: date
          example: "2026-05-23"
        series:
          type: object
          description: "Keys are vital type names (bp, spo2, weight, heartRate, temperature). bp → BpSeries; others → SimpleSeries"
          additionalProperties: true

    GroupedObservation:
      type: object
      properties:
        type:
          type: string
          example: "systolicBp"
        display:
          type: string
          example: "Systolic BP"
        value:
          type: number
          format: double
          example: 135.0
        unit:
          type: string
          example: "mm[Hg]"
        flagged:
          type: boolean
          example: false

    TimelineEvent:
      type: object
      properties:
        id:
          type: string
          example: "enc789"
        type:
          type: string
          enum: [encounter, report, vital, condition]
          example: "encounter"
        date:
          type: string
          format: date
          example: "2026-05-15"
        title:
          type: string
          example: "Office Visit"
        subtitle:
          type: string
          example: "Annual physical"
        status:
          type: string
          example: "finished"
        resourceId:
          type: string
          example: "enc789"
        metadata:
          type: object
          additionalProperties: true
        chiefComplaint:
          type: string
          example: "Fatigue"
        note:
          type: string
          example: "Patient reports fatigue over the past two weeks."
        groupedObservations:
          type: array
          items:
            $ref: '#/components/schemas/GroupedObservation'
        linkedTo:
          type: string
          description: Resource ID this event is linked to (e.g. DiagnosticReport → ServiceRequest)
          example: "sr789"
        linkedFrom:
          type: string
          description: Resource ID linked back to this event
          example: "dr001"

    GoalProgress:
      type: object
      properties:
        currentValue:
          type: number
          format: double
          example: 7.2
        targetValue:
          type: number
          format: double
          example: 7.0
        baselineValue:
          type: number
          format: double
          example: 8.5
        onTrack:
          type: boolean
          example: true
        percentToGoal:
          type: integer
          example: 87
        message:
          type: string
          example: "0.2 units from target"

    PatientSummary:
      type: object
      properties:
        id:
          type: string
          example: "abc123"
        firstName:
          type: string
          example: "Marcus"
        lastName:
          type: string
          example: "Webb"
        dob:
          type: string
          format: date
          example: "1978-04-15"
        gender:
          type: string
          example: "male"
        mrn:
          type: string
          example: "MRN-0001"
        phone:
          type: string
          example: "555-0101"
        email:
          type: string
          example: "marcus.webb@example.com"

    DashboardResponse:
      type: object
      properties:
        patient:
          $ref: '#/components/schemas/PatientSummary'
        careTeam:
          type: object
          additionalProperties: true
          description: Active care team members
        snapshot:
          $ref: '#/components/schemas/SnapshotResponse'
        upcomingAppointment:
          type: object
          additionalProperties: true
          description: Next scheduled appointment, or null
        recentEncounters:
          type: array
          items:
            type: object
          description: Most recent encounters
        pendingServiceRequests:
          type: array
          items:
            type: object
          description: Active orders not yet fulfilled
        activeCarePlan:
          type: object
          additionalProperties: true
          description: Current active care plan, or null
        recentDiagnosticReport:
          type: object
          additionalProperties: true
          description: Most recent diagnostic report, or null
        warnings:
          type: array
          items:
            type: string
          description: Non-fatal section failures — section is omitted if it appears here
          example: ["careTeam: failed to load"]
