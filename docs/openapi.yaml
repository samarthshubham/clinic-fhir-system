        periodStart:
          type: string
          format: date
          example: "2026-01-01"
        goalIds:
          type: array
          items:
            type: string
          example: ["goal001"]

    GoalRequest:
      type: object
      required: [patientId, description, status]
      properties:
        patientId:
          type: string
          example: "abc123"
        description:
          type: string
          example: "Reduce HbA1c below 7.0%"
        status:
          type: string
          enum: [proposed, planned, accepted, active, on-hold, completed, cancelled, entered-in-error, rejected]
          example: "active"
        targetMeasureCode:
          type: string
          description: LOINC code
          example: "4548-4"
        targetMeasureDisplay:
          type: string
          example: "HbA1c"
        targetValue:
          type: number
          format: double
          example: 7.0
        targetUnit:
          type: string
          example: "%"
        targetDate:
          type: string
          format: date
          example: "2026-12-31"

    # ── Experience API response schemas ────────────────────────────────────

    VitalReading:
      type: object
      properties:
        value:
          type: number
          format: double
          example: 135.0
        unit:
          type: string
          example: "mm[Hg]"
        date:
