        patientId:
          type: string
          example: "abc123"
        medicationName:
          type: string
          example: "Metformin 500mg"
        status:
          type: string
          enum: [active, completed, entered-in-error, intended, stopped, on-hold, unknown, not-taken]
          example: "active"
        dosageText:
          type: string
          example: "1 tablet twice daily with meals"
        startDate:
          type: string
          format: date
          example: "2020-02-01"

    AppointmentRequest:
