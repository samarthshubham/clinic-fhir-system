    # ── Request DTOs ───────────────────────────────────────────────────────

    PatientRequest:
      type: object
      required: [firstName, lastName, dateOfBirth, gender]
      properties:
        firstName:
          type: string
          example: "Marcus"
        lastName:
          type: string
          example: "Webb"
        dateOfBirth:
          type: string
          format: date
          example: "1978-04-15"
        gender:
          type: string
          example: "male"
        phone:
          type: string
          example: "555-0101"
        email:
          type: string
          format: email
          example: "marcus.webb@example.com"

    EncounterRequest:
      type: object
      required: [patientId, visitDate, status]
      properties:
        patientId:
          type: string
          example: "abc123"
        visitDate:
          type: string
          format: date
          example: "2026-05-15"
        reason:
          type: string
          example: "Annual physical"
        status:
          type: string
          example: "finished"
        practitionerId:
          type: string
          example: "prac456"
        note:
          type: string
          example: "Patient reports fatigue over the past two weeks."

    VitalsRequest:
      type: object
      required: [patientId, effectiveDate]
      properties:
        patientId:
          type: string
          example: "abc123"
        encounterId:
          type: string
          example: "enc789"
        effectiveDate:
          type: string
          format: date
          example: "2026-05-15"
        systolicBp:
          type: integer
          example: 135
        diastolicBp:
          type: integer
          example: 85
        weightKg:
          type: number
          format: double
          example: 82.5
        spo2Percent:
          type: number
          format: double
          example: 97.0
        heartRateBpm:
          type: integer
          example: 72
        temperatureCelsius:
          type: number
          format: double
          example: 36.8

    PractitionerRequest:
      type: object
      required: [firstName, lastName, specialty]
      properties:
        firstName:
          type: string
          example: "Sarah"
        lastName:
          type: string
          example: "Chen"
        specialty:
          type: string
          example: "Internal Medicine"
        npi:
          type: string
          example: "1234567890"
        email:
          type: string
          format: email
          example: "s.chen@clinic.example"

    ConditionRequest:
      type: object
      required: [patientId, code, display, clinicalStatus, onsetDate]
      properties:
        patientId:
          type: string
          example: "abc123"
        encounterId:
          type: string
          example: "enc789"
        code:
          type: string
          description: SNOMED CT or ICD-10 code
          example: "44054006"
        display:
          type: string
          example: "Type 2 Diabetes Mellitus"
        clinicalStatus:
          type: string
          enum: [active, recurrence, relapse, inactive, remission, resolved]
